name: Request deployment
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.repository == 'bbbzi711/firefly' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify private deployment workflow
        env:
          GH_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          DEPLOY_REPOSITORY: ${{ secrets.BLOG_DEPLOY_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$DEPLOY_REPOSITORY"
          jq -n --arg sha "$GITHUB_SHA" '{ref:"master",inputs:{source_sha:$sha}}' > "$RUNNER_TEMP/deploy-request.json"
          gh api --silent --method POST "repos/$DEPLOY_REPOSITORY/actions/workflows/deploy.yml/dispatches" --input "$RUNNER_TEMP/deploy-request.json"
          echo "Deployment requested. Build and deployment logs are kept in the private repository."
